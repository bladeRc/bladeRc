<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Pokibo the Baby: happy, 100% fed, 1-day streak">
<title>Pokibo the Baby</title>
<style>
svg { --bg:#ffffff;--border:#d0d7de;--text:#1f2328;--muted:#59636e;--track:#eaeef2;--food:#1a7f37;--pet:#3178c6; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117;--border:#30363d;--text:#e6edf3;--muted:#9198a1;--track:#21262d;--food:#3fb950;--pet:#3178c6; } }
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
.name { font-size: 18px; font-weight: 700; }
.mood { font-size: 13px; fill: var(--muted); }
.label, .value { font-size: 12px; fill: var(--muted); }
.facts { font-size: 12px; fill: var(--muted); }
.speech { font-size: 11.5px; font-style: italic; fill: var(--muted); }
.fill { transform-box: fill-box; transform-origin: left; animation: grow 0.9s ease-out both; }
.fill.food { fill: var(--food); }
.fill.xp { fill: var(--pet); }
.pet { animation: hop 2.4s steps(1, end) infinite; }
.pet.hyped { animation-duration: 1.1s; }
.pet.sad { animation: none; }
.pet.hungry { animation: shake 2.6s steps(1, end) infinite; }
.pet.egg { animation: shake 3.2s steps(1, end) infinite; }
.closed { opacity: 0; animation: blink 3.6s steps(1, end) infinite; }
.spark { opacity: 0; animation: twinkle 1.8s ease-in-out infinite; }
.drop { opacity: 0; animation: fall 1.2s linear infinite; }
.bowl { animation: hop 1.6s steps(1, end) infinite; }
.float { animation: hop 3s steps(1, end) infinite; opacity: 0.8; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes hop { 0%, 60%, 85%, 100% { transform: translateY(0); } 65%, 80% { transform: translateY(-6px); } }
@keyframes shake { 0%, 70%, 86%, 100% { transform: translateX(0); } 72% { transform: translateX(-6px); } 76% { transform: translateX(6px); } 80% { transform: translateX(-6px); } 84% { transform: translateX(0); } }
@keyframes blink { 0% { opacity: 0; } 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
@keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
@keyframes fall { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(16px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .closed, .drop { opacity: 0; } .spark { opacity: 1; } }
</style>
<rect x="0.5" y="0.5" width="494" height="194" rx="10" fill="var(--bg)" stroke="var(--border)"/>
<rect x="12" y="12" width="170" height="171" rx="8" fill="var(--pet)" fill-opacity="0.09"/>
<line x1="24" x2="170" y1="161" y2="161" stroke="var(--pet)" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
<g shape-rendering="crispEdges"><g class="pet happy"><path fill="#132e4b" d="M79 100h36v6h-36zM73 106h6v6h-6zM115 106h6v6h-6zM67 112h6v6h-6zM121 112h6v6h-6zM61 118h6v6h-6zM127 118h6v6h-6zM61 124h6v6h-6zM127 124h6v6h-6zM61 130h6v6h-6zM127 130h6v6h-6zM61 136h6v6h-6zM127 136h6v6h-6zM61 142h6v6h-6zM127 142h6v6h-6zM67 148h6v6h-6zM121 148h6v6h-6zM73 154h12v6h-12zM109 154h12v6h-12z"/><path fill="#83aedd" d="M79 106h12v6h-12zM73 112h6v6h-6zM67 118h6v6h-6z"/><path fill="#3178c6" d="M91 106h24v6h-24zM79 112h42v6h-42zM73 118h6v6h-6zM91 118h12v6h-12zM115 118h12v6h-12zM67 124h12v6h-12zM91 124h12v6h-12zM115 124h12v6h-12zM67 130h6v6h-6zM79 130h6v6h-6zM91 130h12v6h-12zM109 130h6v6h-6zM121 130h6v6h-6zM67 136h24v6h-24zM103 136h24v6h-24zM73 142h48v6h-48z"/><path fill="#1b1f24" d="M79 118h6v6h-6zM103 118h6v6h-6zM79 124h12v6h-12zM103 124h12v6h-12zM85 130h6v6h-6zM103 130h6v6h-6zM91 136h12v6h-12z"/><path fill="#ffffff" d="M85 118h6v6h-6zM109 118h6v6h-6z"/><path fill="#ff9eb5" d="M73 130h6v6h-6zM115 130h6v6h-6z"/><path fill="#255a95" d="M67 142h6v6h-6zM121 142h6v6h-6zM73 148h48v6h-48z"/><g class="closed"><path fill="#3178c6" d="M79 118h12v6h-12zM103 118h12v6h-12z"/></g></g></g>
<text class="name" x="200" y="38">Pokibo the Baby</text>
<text class="mood" x="200" y="59">happy  ^_^</text>
<text class="label" x="200" y="84">food</text><rect x="252" y="76" width="160" height="9" rx="4.5" fill="var(--track)"/><rect class="fill food" style="animation-delay:0s" x="252" y="76" width="160.0" height="9" rx="4.5"/><text class="value" x="481" y="84" text-anchor="end">100%</text>
<text class="label" x="200" y="108">xp</text><rect x="252" y="100" width="160" height="9" rx="4.5" fill="var(--track)"/><rect class="fill xp" style="animation-delay:0.15s" x="252" y="100" width="96.6" height="9" rx="4.5"/><text class="value" x="481" y="108" text-anchor="end">91/150 xp</text>
<text class="label" x="200" y="136">streak</text>
<text class="value" x="252" y="136">🔥 1 day  ·  best 1</text>
<text class="facts" x="200" y="160">7 commits  ·  0 days old  ·  TypeScript  ·  @bladeRc</text>
<text class="speech" x="200" y="180">“Nom nom. Good commit.”</text>
</svg>
